<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toolbox — minimal (pure HTML)</title>
<style>
  :root { --bg: #87ceeb; --ink: #0f172a; --panel: #ffffff; --line: #5aa9d6; --accent: #0f172a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eaf6ff; font: 13px/1.3 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink); }
  .box { width: 360px; height: 52px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, .18); }
  button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: rgba(255, 255, 255, .55); color: var(--ink); cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, .85); }
  button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .copy { flex: 1; height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--accent); color: #ffffff; font-weight: 700; font-size: 12px; }
  .close { margin-left: 0; }

  .settings { width: 360px; margin: 16px auto 0; background: #ffffff; border: 1px solid #d7e0ea; border-radius: 10px; box-shadow: 0 1px 3px rgba(15, 23, 42, .08); padding: 14px 16px; text-align: left; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .settings h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .settings .chip { display: inline-flex; align-items: center; justify-content: center; width: auto; height: 26px; padding: 0 10px; border: 1px solid #d7e0ea; border-radius: 6px; background: #f8fafc; color: #334155; font-size: 11.5px; white-space: nowrap; cursor: pointer; }
  .settings .chip:hover { background: #eef2f7; border-color: #cbd5e1; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-bottom: 12px; font-size: 12px; color: #334155; }
  .checks label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .checks input { width: 13px; height: 13px; margin: 0; accent-color: #0f172a; }
  .custom-label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
  .settings textarea { width: 100%; min-height: 44px; padding: 6px 8px; border: 1px solid #d7e0ea; border-radius: 6px; background: #f8fafc; color: #0f172a; font: 11px ui-monospace, Menlo, monospace; resize: vertical; }
  .settings textarea:focus { outline: none; border-color: #94a3b8; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .settings .btn { display: inline-flex; align-items: center; justify-content: center; width: auto; height: 28px; padding: 0 12px; border: 1px solid #d7e0ea; border-radius: 6px; background: #f8fafc; color: #334155; white-space: nowrap; cursor: pointer; font-size: 12px; }
  .settings .btn:hover { background: #eef2f7; }
  .settings .btn.save { background: #0f172a; color: #fff; border-color: #0f172a; }
  .settings .btn.save:hover { background: #1e293b; }

  .settings .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid #d7e0ea; padding-bottom: 8px; }
  .settings .tab { display: inline-flex; align-items: center; justify-content: center; width: auto; height: 26px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #64748b; font-size: 12px; white-space: nowrap; cursor: pointer; }
  .settings .tab:hover { color: #334155; background: #f8fafc; }
  .settings .tab.active { color: #0f172a; background: #f8fafc; border-color: #d7e0ea; font-weight: 600; }
  .panel { min-height: 118px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #334155; }
  .row select { width: 150px; height: 28px; padding: 0 8px; border: 1px solid #d7e0ea; border-radius: 6px; background: #f8fafc; color: #0f172a; font-size: 12px; }
  .row label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .row input[type="checkbox"] { accent-color: #0f172a; width: 13px; height: 13px; }</style></head><body>
<div class="box">
  <button title="To child" aria-label="To child"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button title="To parent" aria-label="To parent"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <button title="Move" aria-label="Move"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
  <button class="copy" title="Copy path" aria-label="Copy path">Copy path</button>
  <button class="close" title="Quit" aria-label="Quit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<section class="settings">
  <h2>Settings</h2>
  <div class="tabs">
    <button class="tab active" data-tab="style">Style</button>
    <button class="tab" data-tab="path">Path</button>
    <button class="tab" data-tab="output">Output</button>
    <button class="tab" data-tab="toolbar">Toolbar</button>
  </div>

  <div class="panel" data-panel="style">
    <div class="presets">
      <button class="chip">color only</button>
      <button class="chip">essentials</button>
      <button class="chip">typography</button>
      <button class="chip">box</button>
      <button class="chip">all</button>
      <button class="chip">clear</button>
    </div>
    <div class="checks">
      <label><input type="checkbox" checked> color</label>
      <label><input type="checkbox" checked> background-color</label>
      <label><input type="checkbox"> font-size</label>
      <label><input type="checkbox"> display</label>
      <label><input type="checkbox"> width</label>
      <label><input type="checkbox"> height</label>
    </div>
    <div class="custom-label">Custom (comma-separated):</div>
    <textarea placeholder="e.g. color, background-color, font-size"></textarea>
  </div>

  <div class="panel" data-panel="path" hidden>
    <div class="row"><span>Default format</span><select><option>Context</option><option>XPath</option><option>CSS</option><option>Playwright</option></select></div>
    <div class="row"><span>Include test attrs</span><select><option>all</option><option>data-testid only</option><option>none</option></select></div>
    <div class="row"><label><input type="checkbox" checked> shadow boundaries</label></div>
    <div class="row"><label><input type="checkbox" checked> close shadow host</label></div>
  </div>

  <div class="panel" data-panel="output" hidden>
    <div class="row"><span>Separator</span><select><option>newline</option><option>numbered</option><option>comma</option><option>JSON</option></select></div>
    <div class="row"><label><input type="checkbox"> close after copy</label></div>
    <div class="row"><label><input type="checkbox" checked> show toast</label></div>
    <div class="row"><label><input type="checkbox"> compact paths</label></div>
  </div>

  <div class="panel" data-panel="toolbar" hidden>
    <div class="row"><label><input type="checkbox" checked> show to child/parent</label></div>
    <div class="row"><label><input type="checkbox" checked> show move</label></div>
    <div class="row"><label><input type="checkbox" checked> show settings</label></div>
    <div class="row"><label><input type="checkbox" checked> fixed size</label></div>
    <div class="row"><span>Theme</span><select><option>Carbon</option><option>Midnight</option><option>Paper</option><option>Mono</option></select></div>
  </div>

  <div class="actions">
    <button class="btn">Cancel</button>
    <button class="btn save">Save</button>
  </div>
</section>
<script>
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.toggle('active', t === tab));
    panels.forEach(p => p.hidden = p.dataset.panel !== tab.dataset.tab);
  }));
</script>

</body></html>
